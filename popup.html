<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Docs AI System Prompt</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        margin: 0;
        padding: 12px;
        width: 360px;
        background: #fafafa;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-weight: 500;
      }
      textarea {
        width: 100%;
        min-height: 160px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        resize: vertical;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        gap: 8px;
      }
      button {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #888;
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      button.primary {
        background: #1f6feb;
        color: #fff;
        border-color: #1f6feb;
      }
      .status {
        margin-top: 8px;
        font-size: 12px;
        color: #555;
        min-height: 16px;
      }
      .hint {
        font-size: 11px;
        color: #777;
        margin-top: 6px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="enabled" />
      Intercept AI requests on this site
    </label>

    <label>
      <input type="checkbox" id="showReasoning" />
      Show reasoning tip (floating panel)
    </label>

    <textarea id="prompt" placeholder="You are a helpful assistant..."></textarea>

    <div class="row">
      <button id="reset">Reset</button>
      <button id="save" class="primary">Save</button>
    </div>

    <div class="status" id="status"></div>

    <div class="hint">
      When enabled, calls to <code>/ai-transform/</code> on docs.numerique.gouv.fr (or
      localhost) are rerouted to <code>/ai-proxy/</code> with the system prompt above.
      The user's text becomes the user message. Reload the docs tab after toggling.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
