<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Docs AI Custom Actions</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        margin: 0;
        padding: 12px;
        width: 380px;
        background: #fafafa;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-weight: 500;
      }
      textarea, input[type="text"] {
        width: 100%;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        gap: 8px;
      }
      button {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #888;
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      button.primary {
        background: #1f6feb;
        color: #fff;
        border-color: #1f6feb;
      }
      .status {
        margin-top: 8px;
        font-size: 12px;
        color: #555;
        min-height: 16px;
      }
      .hint {
        font-size: 11px;
        color: #777;
        margin-top: 6px;
        line-height: 1.4;
      }
      .section-title {
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .04em;
        color: #555;
        margin-bottom: 8px;
      }
      .action-row {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 8px;
        background: #fff;
      }
      .action-row .action-head {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 6px;
      }
      .action-row input.action-name {
        flex: 1;
        font-family: -apple-system, sans-serif;
        font-size: 12px;
        padding: 5px 7px;
      }
      .action-row textarea.action-prompt {
        min-height: 56px;
        font-size: 11px;
      }
      .action-row button.action-delete {
        flex: 0 0 auto;
        padding: 4px 9px;
        font-size: 14px;
        line-height: 1;
        color: #b33;
        border-color: #ddd;
      }
      .actions-empty {
        font-size: 11px;
        color: #888;
        font-style: italic;
        margin-bottom: 8px;
      }
      #addAction {
        flex: 1;
        font-size: 12px;
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="showReasoning" />
      Show reasoning tip (floating panel)
    </label>

    <div class="section-title">Custom actions in AI menu</div>
    <div id="actions-list"></div>
    <div class="row">
      <button id="addAction" type="button">+ Add action</button>
    </div>

    <div class="row">
      <button id="reset">Reset</button>
      <button id="save" class="primary">Save</button>
    </div>

    <div class="status" id="status"></div>

    <div class="hint">
      Each action appears with a ★ prefix in both the BlockNote "Ask AI" menu and the legacy
      "Actions IA" toolbar dropdown. Clicking one applies its system prompt to the current
      selection.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
